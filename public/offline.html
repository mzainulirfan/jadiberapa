<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Saberaha</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f5f4;
        color: #37352f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      }
      .card {
        max-width: 340px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid #ebeae8;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: #0075de;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #787066; margin: 0 0 20px; }
      button {
        appearance: none;
        border: none;
        background: #0075de;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M5 22h14c1.103 0 2-.897 2-2V9a1 1 0 0 0-1-1h-3V7c0-2.757-2.243-5-5-5S7 4.243 7 7v1H4a1 1 0 0 0-1 1v11c0 1.103.897 2 2 2zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v1H9V7zm-4 3h2v2h2v-2h6v2h2v-2h2l.002 10H5V10z" />
        </svg>
      </div>
      <h1>Sedang offline</h1>
      <p>Halaman ini belum tersimpan untuk mode offline. Sambungkan internet lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
